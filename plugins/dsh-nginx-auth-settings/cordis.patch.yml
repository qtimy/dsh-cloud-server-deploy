# RC.8 chooses the settings mirror mode once when its client plugin starts.
# Add a service gate to the original row, keeping its module enabled and clean.
- id: ui-settings
  name: '@deepseek-ai/dsh-client-ui-settings'
  inject:
    - nginxAuthSettingsReady

- insert:
    - id: nginx-auth-settings-trust
      name: dsh-nginx-auth-settings

# RC.8 chooses the settings mirror mode once when its client plugin starts.
# Replace the early row with a wrapper that authenticates first and then calls
# the unmodified official settings client.
- id: ui-settings
  name: '@deepseek-ai/dsh-client-ui-settings'
  disabled: true

- insert:
    - id: ui-settings-nginx-auth
      name: dsh-nginx-auth-settings
